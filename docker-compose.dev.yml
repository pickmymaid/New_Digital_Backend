version: "3.9"

services:
  server:
    build:
      context: ./server
      target: dev
    container_name: node-server
    env_file:
      - ./server/.env.dev
    environment:
      - NODE_ENV=development
    volumes:
      - ./server:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
