# TEMPLATE ONLY. Every value below is a placeholder — do not apply this
# file as-is, and never commit a copy of it with real values filled in.
#
# Recommended workflow:
#   cp 02-secret.example.yaml 02-secret.yaml
#   # fill in real values in 02-secret.yaml
#   echo "k8s/02-secret.yaml" >> ../.gitignore
#   kubectl apply -f 02-secret.yaml
#
# Better still, for a real deploy: don't hand-edit secret YAML at all —
# use `kubectl create secret generic ... --from-literal=KEY=VALUE` piped
# from your existing GitHub Actions secrets, or a proper secrets manager
# (DigitalOcean doesn't have a native one; External Secrets Operator +
# a vault of your choice is the standard approach once this goes real).
#
# shared-secret: values BOTH Backend1 and Backend2 need — same secret,
# same value, in both. This is what makes JWT verification and session
# cookie decoding work identically across services (see ARCHITECTURE.md).
apiVersion: v1
kind: Secret
metadata:
  name: shared-secret
  namespace: pickmymaid
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://<user>:<password>@<cluster>/pickmymaid?retryWrites=true&w=majority"
  JWT_SECRET: "REPLACE_WITH_32PLUS_CHAR_RANDOM_SECRET"
  COOKIE_KEY: "REPLACE_WITH_32PLUS_CHAR_RANDOM_SECRET"
  # Shared-secret header check for Backend2's /internal/* routes, called
  # only by Backend1 (see ARCHITECTURE.md). Generate with: openssl rand -hex 32
  INTERNAL_SERVICE_TOKEN: "REPLACE_WITH_RANDOM_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend1-secret
  namespace: pickmymaid
type: Opaque
stringData:
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_EMAIL_PASS: "REPLACE_ME"
  DO_SPACES_ACCESS_KEY: "REPLACE_ME"
  DO_SPACES_SECRET_KEY: "REPLACE_ME"
  SA_EMAIL: "superadmin@example.com"
  NEXTJS_REVALIDATE_SECRET: "REPLACE_ME"
  REVALIDATE_SECRET: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend2-secret
  namespace: pickmymaid
type: Opaque
stringData:
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_EMAIL_PASS: "REPLACE_ME"
  GOOGLE_CLIENT_ID: "REPLACE_ME"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"
  FB_APP_ID: "REPLACE_ME"
  FB_APP_SECRET: "REPLACE_ME"
  APPLE_CLIENT_ID: "REPLACE_ME"
  APPLE_TEAM_ID: "REPLACE_ME"
  APPLE_KEY_ID: "REPLACE_ME"
  # Base64-encoded contents of the Sign in with Apple .p8 key.
  # PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("AuthKey_XXXX.p8"))
  APPLE_AUTH_KEY_P8_BASE64: "REPLACE_ME"
  PG_API_KEY: "REPLACE_ME"
  PG_OUTLET_REFERENCE: "REPLACE_ME"
  COMPANY_TOKEN: "REPLACE_ME"
  COMPANY_SERVICE: "REPLACE_ME"
