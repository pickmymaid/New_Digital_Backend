apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend1
  namespace: pickmymaid
  labels:
    app: backend1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend1
  template:
    metadata:
      labels:
        app: backend1
    spec:
      containers:
        - name: backend1
          image: registry.digitalocean.com/pickmymaid/backend1:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: shared-config
            - configMapRef:
                name: backend1-config
            - secretRef:
                name: shared-secret
            - secretRef:
                name: backend1-secret
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend1
  namespace: pickmymaid
spec:
  selector:
    app: backend1
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
