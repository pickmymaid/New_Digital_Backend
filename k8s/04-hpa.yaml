# Only Backend1 autoscales. Backend2 stays fixed at 1 replica (see
# backend2.yaml note about the in-process subscription cron) until that
# cron is moved to a K8s CronJob. Requires the metrics-server addon,
# which DOKS enables by default.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend1
  namespace: pickmymaid
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend1
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
