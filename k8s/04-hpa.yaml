# Only Backend1 autoscales. Backend2 runs a fixed 2 replicas (backend2.yaml);
# its subscription-expiry job runs once cluster-wide via the K8s CronJob in
# 05-backend2-cronjob.yaml, so extra replicas don't double-process it.
# Requires the metrics-server addon, which DOKS enables by default.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend1
  namespace: pickmymaid
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend1
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
