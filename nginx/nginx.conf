# Reverse proxy + TLS termination for the docker-compose (non-Kubernetes)
# deployment of Backend1 + Backend2. Routes the same paths the k8s
# ingress.yaml does — keep the two in sync if you add a route.
#
# Unlike the old haproxy.cfg.prod, this points directly at certbot's
# standard fullchain.pem/privkey.pem output — no separate "combine into
# one file" step is needed for nginx (that step was HAProxy-specific).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 50m; # blog/maid file uploads

    upstream backend1 {
        server backend1:8080;
    }

    upstream backend2 {
        server backend2:8081;
    }

    server {
        listen 80;
        server_name api.backendpickmymaid.site;

        # Let certbot's HTTP-01 challenge through, redirect everything else.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.backendpickmymaid.site;

        ssl_certificate     /etc/letsencrypt/live/api.backendpickmymaid.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.backendpickmymaid.site/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Backend2 — auth + payment
        location /api/v1/auth {
            proxy_pass http://backend2;
            include /etc/nginx/proxy_params.conf;
        }
        location /api/v2/auth {
            proxy_pass http://backend2;
            include /etc/nginx/proxy_params.conf;
        }
        location /api/v1/payment {
            proxy_pass http://backend2;
            include /etc/nginx/proxy_params.conf;
        }
        location /api/v2/payment {
            proxy_pass http://backend2;
            include /etc/nginx/proxy_params.conf;
        }

        # Backend1 — admin, maids/jobs, blog, contact, analytics
        location /api/v1/admin {
            proxy_pass http://backend1;
            include /etc/nginx/proxy_params.conf;
        }
        location /api/v1/job {
            proxy_pass http://backend1;
            include /etc/nginx/proxy_params.conf;
        }
        location /api/v1/contact {
            proxy_pass http://backend1;
            include /etc/nginx/proxy_params.conf;
        }
        location /api/v1/blog {
            proxy_pass http://backend1;
            include /etc/nginx/proxy_params.conf;
        }
        location /api/v2/maids {
            proxy_pass http://backend1;
            include /etc/nginx/proxy_params.conf;
        }
        location /api/v1/analytics {
            proxy_pass http://backend1;
            include /etc/nginx/proxy_params.conf;
        }
        location /api/v1/test {
            proxy_pass http://backend1;
            include /etc/nginx/proxy_params.conf;
        }

        # NOTE: no location block for /internal/ — deliberately not
        # exposed here. Backend1 reaches Backend2's internal routes
        # directly over the compose network (http://backend2:8081),
        # bypassing nginx entirely. See ARCHITECTURE.md.
    }
}
