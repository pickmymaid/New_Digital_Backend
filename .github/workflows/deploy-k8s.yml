name: Deploy Microservices to DOKS

# Runs on every push to main that touches a backend or its k8s manifests,
# and can also be run manually from the Actions tab. "Detect changed
# backends" builds a matrix containing only the backend(s) that actually
# changed, so Test / Build & Push / Deploy each show up as one named job
# per affected backend (e.g. "Test — Backend1") instead of running (or
# rebuilding/redeploying) an untouched service.
on:
  push:
    branches: [main]
    paths:
      - 'Backend1/**'
      - 'Backend2/**'
      - 'k8s/**'
      - '.github/workflows/deploy-k8s.yml'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Test, build and deploy both backends regardless of what changed'
        type: boolean
        default: false

concurrency:
  group: deploy-k8s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect changed backends
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      any: ${{ steps.compute.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend1:
              - 'Backend1/**'
              - 'k8s/backend1.yaml'
              - 'k8s/01-configmap.yaml'
              - 'k8s/04-hpa.yaml'
            backend2:
              - 'Backend2/**'
              - 'k8s/backend2.yaml'
              - 'k8s/01-configmap.yaml'

      - name: Build backend matrix
        id: compute
        env:
          BACKEND1_CHANGED: ${{ steps.filter.outputs.backend1 }}
          BACKEND2_CHANGED: ${{ steps.filter.outputs.backend2 }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all }}
        run: |
          node -e "
            const include = [];
            const force = process.env.FORCE_ALL === 'true';
            if (force || process.env.BACKEND1_CHANGED === 'true') {
              include.push({key:'backend1',name:'Backend1',dir:'Backend1',image:'backend1',manifest:'k8s/backend1.yaml',deployment:'backend1'});
            }
            if (force || process.env.BACKEND2_CHANGED === 'true') {
              include.push({key:'backend2',name:'Backend2',dir:'Backend2',image:'backend2',manifest:'k8s/backend2.yaml',deployment:'backend2'});
            }
            console.log('matrix=' + JSON.stringify({include}));
            console.log('any=' + (include.length > 0));
          " >> "$GITHUB_OUTPUT"

  test:
    name: "Test — ${{ matrix.name }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    # app.js kicks off a real DB connection as soon as it's required (not
    # awaited, not caught) — without a reachable Mongo here, that connection
    # attempt eventually rejects as an unhandled rejection well after the
    # test itself finished, which node:test correctly treats as a failure.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: ${{ matrix.dir }}
      - run: npm test
        working-directory: ${{ matrix.dir }}
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/ci_smoke_test

  build-and-push:
    name: "Build & Push — ${{ matrix.name }}"
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Build
        run: docker build -t registry.digitalocean.com/pickmymaid/${{ matrix.image }}:${{ github.sha }} -t registry.digitalocean.com/pickmymaid/${{ matrix.image }}:latest ${{ matrix.dir }}

      - name: Push
        run: |
          docker push registry.digitalocean.com/pickmymaid/${{ matrix.image }}:${{ github.sha }}
          docker push registry.digitalocean.com/pickmymaid/${{ matrix.image }}:latest

  deploy:
    name: "Deploy — ${{ matrix.name }}"
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save pickmymaid-cluster

      - name: Apply cluster-wide manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-configmap.yaml
          kubectl apply -f k8s/03-cluster-issuer.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Apply this backend's Deployment/Service
        run: kubectl apply -f ${{ matrix.manifest }}

      - name: Apply HPA (Backend1 only)
        if: matrix.key == 'backend1'
        run: kubectl apply -f k8s/04-hpa.yaml

      # Secret values come straight from this repo's GitHub Actions secrets
      # and are piped directly into kubectl — they're never written to a
      # file in the repo or checked out anywhere. Uses --dry-run=client so
      # re-running this workflow updates the secrets in place instead of
      # failing on "already exists".
      - name: Apply shared secret
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
        run: |
          kubectl create secret generic shared-secret -n pickmymaid \
            --from-literal=MONGODB_URI="$MONGODB_URI" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=COOKIE_KEY="$COOKIE_KEY" \
            --from-literal=INTERNAL_SERVICE_TOKEN="$INTERNAL_SERVICE_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply backend1 secret
        if: matrix.key == 'backend1'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_EMAIL_PASS: ${{ secrets.ADMIN_EMAIL_PASS }}
          DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
          SA_EMAIL: ${{ secrets.SA_EMAIL }}
          NEXTJS_REVALIDATE_SECRET: ${{ secrets.NEXTJS_REVALIDATE_SECRET }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          kubectl create secret generic backend1-secret -n pickmymaid \
            --from-literal=ADMIN_EMAIL="$ADMIN_EMAIL" \
            --from-literal=ADMIN_EMAIL_PASS="$ADMIN_EMAIL_PASS" \
            --from-literal=DO_SPACES_ACCESS_KEY="$DO_SPACES_ACCESS_KEY" \
            --from-literal=DO_SPACES_SECRET_KEY="$DO_SPACES_SECRET_KEY" \
            --from-literal=SA_EMAIL="$SA_EMAIL" \
            --from-literal=NEXTJS_REVALIDATE_SECRET="$NEXTJS_REVALIDATE_SECRET" \
            --from-literal=REVALIDATE_SECRET="$REVALIDATE_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply backend2 secret
        if: matrix.key == 'backend2'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_EMAIL_PASS: ${{ secrets.ADMIN_EMAIL_PASS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_AUTH_KEY_P8_BASE64: ${{ secrets.APPLE_AUTH_KEY_P8_BASE64 }}
          PG_API_KEY: ${{ secrets.PG_API_KEY }}
          PG_OUTLET_REFERENCE: ${{ secrets.PG_OUTLET_REFERENCE }}
          COMPANY_TOKEN: ${{ secrets.COMPANY_TOKEN }}
          COMPANY_SERVICE: ${{ secrets.COMPANY_SERVICE }}
        run: |
          kubectl create secret generic backend2-secret -n pickmymaid \
            --from-literal=ADMIN_EMAIL="$ADMIN_EMAIL" \
            --from-literal=ADMIN_EMAIL_PASS="$ADMIN_EMAIL_PASS" \
            --from-literal=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --from-literal=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            --from-literal=FB_APP_ID="$FB_APP_ID" \
            --from-literal=FB_APP_SECRET="$FB_APP_SECRET" \
            --from-literal=APPLE_CLIENT_ID="$APPLE_CLIENT_ID" \
            --from-literal=APPLE_TEAM_ID="$APPLE_TEAM_ID" \
            --from-literal=APPLE_KEY_ID="$APPLE_KEY_ID" \
            --from-literal=APPLE_AUTH_KEY_P8_BASE64="$APPLE_AUTH_KEY_P8_BASE64" \
            --from-literal=PG_API_KEY="$PG_API_KEY" \
            --from-literal=PG_OUTLET_REFERENCE="$PG_OUTLET_REFERENCE" \
            --from-literal=COMPANY_TOKEN="$COMPANY_TOKEN" \
            --from-literal=COMPANY_SERVICE="$COMPANY_SERVICE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Roll out new image
        run: |
          kubectl -n pickmymaid rollout restart deployment/${{ matrix.deployment }}
          kubectl -n pickmymaid rollout status deployment/${{ matrix.deployment }}
